# Supabase CLI configuration for LendFlow
project_id = "lendflow"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# Lender accounts are created by the platform admin (admin console); public sign-up is off
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "20MiB"

# All functions validate the caller themselves (auth.getUser / signing tokens),
# so gateway JWT verification is disabled to support both legacy and new API keys.
[functions.agreement-generate]
verify_jwt = false

[functions.agreement-sign]
verify_jwt = false

[functions.public-signing]
verify_jwt = false

[functions.receipt-pdf]
verify_jwt = false

[functions.admin-users]
verify_jwt = false

[functions.platform-admin]
verify_jwt = false

[functions.template-ai]
verify_jwt = false
